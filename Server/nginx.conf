worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log info;
events { worker_connections 128; }
http {
    default_type application/octet-stream;
    log_format resources '$time_iso8601 $request_method $uri $status $body_bytes_sent';
    access_log logs/access.log resources;
    sendfile on;
    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root html;
        add_header Cache-Control "no-store" always;
        location / { autoindex on; }
        location = /health.txt { default_type text/plain; }
    }
}
